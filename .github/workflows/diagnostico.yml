name: Diagnóstico de fuentes

on:
  workflow_dispatch:
    inputs:
      correo_prueba:
        description: "Enviar a tu correo una prueba del correo de postulación (con la HV)"
        type: boolean
        default: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # OCR para leer las vacantes publicadas como imagen en LinkedIn
      - run: sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa > /dev/null
      - name: Probar fuentes
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          LINKEDIN_IMAP_USER: ${{ secrets.LINKEDIN_IMAP_USER }}
          LINKEDIN_IMAP_PASSWORD: ${{ secrets.LINKEDIN_IMAP_PASSWORD }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python herramientas/diagnostico.py
      - name: Correo de prueba de postulación (solo a tu correo)
        if: ${{ inputs.correo_prueba }}
        env:
          CV_GPG_PASSPHRASE: ${{ secrets.CV_GPG_PASSPHRASE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NOMBRE_REMITENTE: ${{ secrets.NOMBRE_REMITENTE }}
          FIRMA_CORREO: ${{ secrets.FIRMA_CORREO }}
        run: |
          gpg --quiet --batch --yes --pinentry-mode loopback --passphrase "$CV_GPG_PASSPHRASE" \
              --output cv/hoja_de_vida.pdf --decrypt cv/hoja_de_vida.pdf.gpg
          python herramientas/probar_postulacion.py
