name: Bot de vacantes

# Se ejecuta CADA HORA. Dos mecanismos, por si uno falla:
#  1. Cadena: al terminar, el job "programar-siguiente" espera ~1 hora y lanza la
#     siguiente ejecución. (En repositorios públicos los minutos de Actions son
#     gratis.) Para arrancar la cadena basta un "Run workflow" manual.
#  2. Horario de GitHub (cron) como respaldo: si la cadena se corta, la reanuda.
#     En minuto 17 porque a la hora en punto GitHub se satura y omite ejecuciones.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:          # botón "Run workflow" para probar a mano

concurrency:
  group: job-bot
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # OCR para leer las vacantes publicadas como imagen en LinkedIn
      - run: sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa > /dev/null

      # Memoria de vacantes ya enviadas (para no repetirlas entre ejecuciones)
      - name: Restaurar vacantes vistas
        uses: actions/cache/restore@v4
        with:
          path: data
          key: job-bot-seen-${{ github.run_id }}
          restore-keys: job-bot-seen-

      # Hoja de vida cifrada en el repo (el repo es público): se descifra aquí.
      - name: Descifrar hoja de vida
        env:
          CV_GPG_PASSPHRASE: ${{ secrets.CV_GPG_PASSPHRASE }}
        run: |
          if [ -n "$CV_GPG_PASSPHRASE" ] && [ -f cv/hoja_de_vida.pdf.gpg ]; then
            gpg --quiet --batch --yes --pinentry-mode loopback --passphrase "$CV_GPG_PASSPHRASE" \
                --output cv/hoja_de_vida.pdf --decrypt cv/hoja_de_vida.pdf.gpg
            echo "Hoja de vida lista para las postulaciones"
          else
            echo "Sin hoja de vida cifrada: no habrá postulaciones automáticas"
          fi

      - name: Buscar y notificar
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
          LINKEDIN_IMAP_USER: ${{ secrets.LINKEDIN_IMAP_USER }}
          LINKEDIN_IMAP_PASSWORD: ${{ secrets.LINKEDIN_IMAP_PASSWORD }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          NOMBRE_REMITENTE: ${{ secrets.NOMBRE_REMITENTE }}
          FIRMA_CORREO: ${{ secrets.FIRMA_CORREO }}
        run: python -m bot.main

      - name: Guardar vacantes vistas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: job-bot-seen-${{ github.run_id }}

  # Espera y lanza la siguiente ejecución. La "concurrency" de arriba garantiza
  # que nunca corran dos cadenas a la vez (las ejecuciones extra en espera se
  # cancelan solas).
  programar-siguiente:
    needs: buscar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
    steps:
      - name: Esperar hasta la próxima hora
        run: sleep 3300
      - name: Lanzar la siguiente ejecución
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run job_bot.yml --repo "${{ github.repository }}" --ref main
