# Configuración del bot de vacantes.
# Edita este archivo para ajustar búsquedas, filtros y fuentes.

perfil:
  # Ruta a tu hoja de vida (PDF o TXT). Opcional: si no existe se usa la
  # variable de entorno CV_TEXT (útil para no subir tu HV al repositorio).
  hoja_de_vida: cv/hoja_de_vida.pdf

  # Términos que se buscan en los portales.
  busquedas:
    - sistemas
    - desarrollador
    - soporte tecnico
    - redes
    - infraestructura ti
    - analista de sistemas
    - ingeniero de software
    - cloud

# --- Filtro de ubicación: solo Antioquia ---
ubicacion:
  incluir_remoto: false   # true = acepta también vacantes 100% remotas en Colombia
  municipios:
    - antioquia
    - medellin
    - valle de aburra
    - envigado
    - itagui
    - bello
    - sabaneta
    - la estrella
    - caldas
    - copacabana
    - girardota
    - barbosa
    - rionegro
    - marinilla
    - la ceja
    - el retiro
    - guarne
    - el carmen de viboral
    - santa fe de antioquia
    - apartado
    - turbo
    - caucasia
    - puerto berrio
    - yarumal
    - andes
    - jerico

# --- Filtro de área: sistemas / informática ---
area:
  # Términos claros de sistemas. Si alguno aparece en el TÍTULO, la vacante
  # cuenta como de sistemas. En la descripción se exigen al menos 2 distintos.
  incluir:
    - informatica
    - software
    - desarrollador
    - developer
    - programador
    - soporte tecnico
    - soporte ti
    - soporte a usuarios
    - mesa de ayuda
    - help desk
    - cloud
    - devops
    - dba
    - ciberseguridad
    - seguridad informatica
    - tecnologia de la informacion
    - tecnologias de la informacion
    - area de ti
    - analista ti
    - ingeniero de sistemas
    - ingenieria de sistemas
    - tecnico en sistemas
    - tecnico de sistemas
    - tecnologo en sistemas
    - auxiliar de sistemas
    - analista de sistemas
    - full stack
    - fullstack
    - frontend
    - backend
    - tester
    - analista de datos
    - ingeniero de datos
    - sysadmin
    - administrador de servidores
    - servidores
    - python
    - java
    - javascript
    - sql
    - linux
    - aws
    - azure
    - docker
    - kubernetes
    - active directory
    - windows server
    - cableado estructurado
    - mantenimiento de computadores
    - mantenimiento de equipos de computo

  # Términos AMBIGUOS ("redes sociales", "sistemas de gestión", "infraestructura
  # vial", "QA/QC de soldadura"...). Solo cuentan en el TÍTULO, y si la vacante
  # trae descripción completa, esta debe contener además algún término de `incluir`.
  incluir_titulo:
    - sistemas
    - redes
    - infraestructura
    - telecomunicaciones
    - tecnologia
    - tic
    - qa
    - erp
    - sap
    - base de datos
    - bases de datos
    - programacion

  # Frases que NO son de sistemas aunque contengan esas palabras. Se borran del
  # texto antes de buscar los términos de arriba.
  ignorar:
    - sistemas de gestion
    - sistema de gestion
    - sistemas integrados
    - sistema integrado
    - sistemas de calidad
    - sistema de calidad
    - sistemas hidraulicos
    - sistemas electricos
    - sistemas de riego
    - redes sociales
    - redes electricas
    - redes de gas
    - redes hidraulicas
    - redes hidrosanitarias
    - redes de acueducto
    - redes de alcantarillado
    - redes de distribucion
    - redes de mercadeo
    - infraestructura vial
    - infraestructura fisica
    - infraestructura civil
    - obras de infraestructura
    - tecnologia de alimentos
    - tecnologia en alimentos
    - software contable
    - informatica basica
    - base de datos de clientes
    - bases de datos de clientes
    - programacion de turnos
    - programacion de produccion
    - qa/qc

  # Si alguno aparece en el TÍTULO, la vacante se descarta.
  excluir:
    - comercial
    - vendedor
    - vendedora
    - ventas
    - telemercadeo
    - teleoperador
    - call center
    - mercaderista
    - impulsador
    - impulsadora
    - conductor
    - mensajero
    - domiciliario
    - bodega
    - cajero
    - cajera
    - contable
    - contador
    - contadora
    - cartera
    - enfermeria
    - enfermero
    - enfermera
    - operario
    - operaria
    - cocinero
    - cocinera
    - mesero
    - mesera
    - servicios generales
    - aseo
    - vigilante
    - electricista
    - ingeniero civil
    - community manager

# --- Ejecución ---
ejecucion:
  min_puntaje: 3            # puntaje mínimo para notificar (sube para menos ruido)
  dias_maximos: 10          # ignora vacantes publicadas hace más de N días (si se conoce la fecha)
  max_por_ejecucion: 25     # tope de vacantes enviadas por ejecución
  max_whatsapp: 10          # tope de mensajes de WhatsApp por ejecución
  max_detalles: 120         # tope de páginas de detalle descargadas por ejecución
  pausa_segundos: 1.5       # pausa entre peticiones (ser respetuoso con los portales)

# --- Fuentes ---
# jooble: agregador con API gratuita (requiere JOOBLE_API_KEY). Reúne vacantes de
#         muchos portales colombianos (Computrabajo, elempleo, etc.).
# html:   scraper genérico. `url` usa {q} (búsqueda) y `enlace_regex` reconoce los
#         enlaces a ofertas. Si un portal cambia su web, normalmente basta con
#         ajustar estos dos valores.
fuentes:
  - nombre: jooble
    tipo: jooble
    activa: true
    ubicaciones: [Antioquia, Medellín]

  - nombre: computrabajo
    tipo: html
    activa: true
    url: https://co.computrabajo.com/trabajo-de-{q}-en-antioquia
    enlace_regex: '/ofertas-de-trabajo/oferta-de-trabajo-de-[^"?#]+'
    base: https://co.computrabajo.com

  - nombre: elempleo
    tipo: html
    activa: true
    # La ruta /antioquia/ no filtra por departamento; /medellin/ sí.
    url: https://www.elempleo.com/co/ofertas-empleo/medellin/trabajo-{q}
    enlace_regex: '/co/ofertas-trabajo/[a-z0-9-]+-\d+'
    base: https://www.elempleo.com

  # Las búsquedas por cargo de Magneto responden error 500 (oct-2026); se usa el
  # listado general de Medellín (sin {q}: se descarga una sola vez por ejecución)
  # y los filtros del bot se encargan de dejar solo las de sistemas.
  - nombre: magneto
    tipo: html
    activa: true
    url: https://www.magneto365.com/co/trabajos/ofertas-empleo-en-medellin
    enlace_regex: '/co/empleos/[^"?#\\]+'
    base: https://www.magneto365.com

  # Alertas que LinkedIn, Indeed y Magneto te envían a tu Gmail. El bot las lee
  # (sin marcarlas como leídas), las filtra igual que las demás y las incluye en
  # el resumen. Usa SMTP_USER / SMTP_PASSWORD (o IMAP_USER / IMAP_PASSWORD).
  - nombre: alertas_correo
    tipo: correo
    activa: true
    dias: 3                 # revisa los correos de los últimos N días
    remitentes:
      - nombre: linkedin
        de: [jobalerts-noreply@linkedin.com]   # solo alertas, no confirmaciones
        enlace_regex: 'https?://(?:[a-z]+\.)?linkedin\.com/(?:comm/)?jobs/view/(\d+)'
        url_id: https://www.linkedin.com/jobs/view/{id}/
      - nombre: indeed
        # Solo correos de ALERTAS (no las confirmaciones de postulación).
        de: [jobalert.indeed.com, alert@indeed.com]
        enlace_regex: 'https?://[a-z.]*indeed\.com/(?:rc/clk|pagead/clk|viewjob|m/viewjob)[^"\s<>]*'
        id_regex: '[?&]jk=([0-9a-f]+)'
        url_id: https://co.indeed.com/viewjob?jk={id}
      - nombre: magneto
        de: magneto365.com
        enlace_regex: 'https?://(?:www\.)?magneto365\.com/[^"\s<>]*empleos?/[^"\s<>]+'
