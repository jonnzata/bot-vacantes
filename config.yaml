  # variable de entorno CV_TEXT (útil para no subir tu HV al repositorio).
  hoja_de_vida: cv/hoja_de_vida.pdf
  # PDF que se adjunta en las postulaciones automáticas. En GitHub Actions se
  # descifra desde cv/hoja_de_vida.pdf.gpg (ver README).
  hoja_de_vida_pdf: cv/hoja_de_vida.pdf

  # Términos que se buscan en los portales.
  busquedas:
