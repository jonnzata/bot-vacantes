# --- Ejecución ---
ejecucion:
  min_puntaje: 1            # puntaje mínimo (1 = todas las de sistemas; sube para menos ruido)
  dias_maximos: 10          # ignora vacantes publicadas hace más de N días (si se conoce la fecha)
  max_por_ejecucion: 40     # tope de vacantes enviadas por ejecución
  max_whatsapp: 10          # tope de mensajes de WhatsApp por ejecución
  max_detalles: 150         # tope de páginas de detalle descargadas por ejecución
  pausa_segundos: 1.5       # pausa entre peticiones (ser respetuoso con los portales)

# --- Postulación automática (solo vacantes de LinkedIn con correo) ---
# Las alertas normales a tu correo siguen igual. Además, si una vacante que llegó
# por las alertas de LinkedIn trae un correo para enviar la HV y cumple estas
# reglas, el bot te postula solo y al final te manda un resumen.
autopostulacion:
  activa: true
  fuentes: [linkedin]          # de qué alertas se postula automáticamente
  excluir_empresas:            # nunca se envía la HV a estas empresas
    - netmask
  ciudades_presencial:         # presencial: solo en estas ciudades
    - medellin
  aceptar_hibrido: false       # false = las híbridas no se postulan
  # El teletrabajo (desde Colombia u otro país) siempre se acepta.
  max_por_dia: 15              # tope diario de correos (evita que Gmail te marque como spam)
  max_detalles: 30             # páginas de LinkedIn leídas por ejecución
  # mensaje: |                 # opcional: tu propio texto. Variables: {cargo} {empresa}
  #   ...                      # {empresa_de} {coincidencias} {firma}

# --- Fuentes ---
# remoto: portales de teletrabajo con API o RSS públicos (sin scraping). Se
#         consultan con `cada_horas` para respetar sus límites de uso.
# jooble: agregador con API gratuita (requiere JOOBLE_API_KEY). Reúne vacantes de
#         muchos portales colombianos (Computrabajo, elempleo, etc.).
# html:   scraper genérico. `url` usa {q} (búsqueda) y `enlace_regex` reconoce los
#         enlaces a ofertas. Si un portal cambia su web, normalmente basta con
#         ajustar estos dos valores.
fuentes:
  - nombre: jooble
    tipo: jooble
    activa: true
    ubicaciones: [Antioquia, Medellín]

  - nombre: computrabajo
    tipo: html
    activa: true
    url: https://co.computrabajo.com/trabajo-de-{q}-en-antioquia
    enlace_regex: '/ofertas-de-trabajo/oferta-de-trabajo-de-[^"?#]+'
    base: https://co.computrabajo.com

  - nombre: elempleo
    tipo: html
    activa: true
    # La ruta /antioquia/ no filtra por departamento; /medellin/ sí.
    url: https://www.elempleo.com/co/ofertas-empleo/medellin/trabajo-{q}
    enlace_regex: '/co/ofertas-trabajo/[a-z0-9-]+-\d+'
    base: https://www.elempleo.com

  # Las búsquedas por cargo de Magneto responden error 500 (oct-2026); se usa el
  # listado general de Medellín (sin {q}: se descarga una sola vez por ejecución)
  # y los filtros del bot se encargan de dejar solo las de sistemas.
  - nombre: magneto
    tipo: html
    activa: true
    url: https://www.magneto365.com/co/trabajos/ofertas-empleo-en-medellin
    enlace_regex: '/co/empleos/[^"?#\\]+'
    base: https://www.magneto365.com

  # Alertas que LinkedIn, Indeed y Magneto te envían a tu Gmail. El bot las lee
  # (sin marcarlas como leídas), las filtra igual que las demás y las incluye en
  # el resumen. Usa SMTP_USER / SMTP_PASSWORD (o IMAP_USER / IMAP_PASSWORD).
  - nombre: alertas_correo
    tipo: correo
    activa: true
    dias: 3                 # revisa los correos de los últimos N días
    remitentes:
      - nombre: linkedin
        de: [jobalerts-noreply@linkedin.com]   # solo alertas, no confirmaciones
        enlace_regex: 'https?://(?:[a-z]+\.)?linkedin\.com/(?:comm/)?jobs/view/(\d+)'
        url_id: https://www.linkedin.com/jobs/view/{id}/
      - nombre: indeed
        # Solo correos de ALERTAS (no las confirmaciones de postulación).
        de: [jobalert.indeed.com, alert@indeed.com]
        enlace_regex: 'https?://[a-z.]*indeed\.com/(?:rc/clk|pagead/clk|viewjob|m/viewjob)[^"\s<>]*'
        id_regex: '[?&]jk=([0-9a-f]+)'
        url_id: https://co.indeed.com/viewjob?jk={id}
      - nombre: magneto
        de: magneto365.com
        enlace_regex: 'https?://(?:www\.)?magneto365\.com/[^"\s<>]*empleos?/[^"\s<>]+'

  # --- Teletrabajo en Colombia (cualquier ciudad) ---
  # El filtro solo deja las que dicen remoto/teletrabajo y no son híbridas.
  - nombre: computrabajo_remoto
    tipo: html
    activa: true
    url: https://co.computrabajo.com/trabajo-de-{q}-remoto
    enlace_regex: '/ofertas-de-trabajo/oferta-de-trabajo-de-[^"?#]+'
    base: https://co.computrabajo.com

  - nombre: elempleo_remoto
    tipo: html
    activa: true
    url: https://www.elempleo.com/co/ofertas-empleo/trabajo-{q}-remoto
    enlace_regex: '/co/ofertas-trabajo/[a-z0-9-]+-\d+'
    base: https://www.elempleo.com

  - nombre: jooble_remoto
    tipo: jooble
    activa: true
    ubicaciones: [Colombia]
    sufijo: remoto           # busca "sistemas remoto", "redes remoto"...

  # --- Portales de teletrabajo (LatAm e internacionales) ---
  - nombre: getonbrd         # LatAm, en español, muy fuerte en TI
    tipo: remoto
    activa: true
    cada_horas: 3
  - nombre: remotive
    tipo: remoto
    activa: true
    cada_horas: 8            # piden no consultar más de ~4 veces al día
  - nombre: remoteok
    tipo: remoto
    activa: true
    cada_horas: 3
  - nombre: jobicy           # solo vacantes abiertas a LATAM
    tipo: remoto
    activa: true
    cada_horas: 6
  - nombre: himalayas
    tipo: remoto
    activa: true
    cada_horas: 6
  - nombre: weworkremotely   # RSS: sysadmin/devops, soporte y programación
    tipo: remoto
    activa: true
    cada_horas: 3
  - nombre: workingnomads
    tipo: remoto
    activa: true
    cada_horas: 6
