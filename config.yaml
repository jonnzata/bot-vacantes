    - analista de datos
    - qa tester

# --- Filtro de ubicación: Antioquia o teletrabajo ---
ubicacion:
  # true = acepta también vacantes de teletrabajo de otras ciudades o países,
  # siempre que se puedan hacer desde Colombia (ver regiones_remoto).
  incluir_remoto: true
  # Las vacantes de portales remotos internacionales suelen limitar desde dónde
  # se puede trabajar ("USA only", "Europe"...). Solo se aceptan las que no
  # ponen límite o las que incluyen alguna de estas regiones.
  regiones_remoto:
    - colombia
    - latam
    - latin america
    - latinoamerica
    - america latina
    - south america
    - sudamerica
    - americas
    - worldwide
    - anywhere
    - global
    - world
    - cualquier lugar
